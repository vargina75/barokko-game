<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эпоха барокко | Обучающая игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'EB Garamond', serif;
            background: linear-gradient(135deg, #faf6f0 0%, #f0ebe0 100%);
            color: #3a2a1a;
            overflow-x: hidden;
            min-height: 100vh;
            font-size: 19px;
            line-height: 1.7;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            padding: 50px 20px;
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(139, 90, 43, 0.15);
            border: 3px solid #c9a96e;
            position: relative;
        }

        .header::before,
        .header::after {
            content: '';
            position: absolute;
            font-size: 2rem;
            color: #c9a96e;
            opacity: 0.6;
        }

        .header::before { top: 15px; left: 30px; }
        .header::after { bottom: 15px; right: 30px; }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.8rem;
            font-weight: 700;
            color: #5c3a21;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-style: italic;
        }

        .header .subtitle {
            font-size: 1.6rem;
            color: #8b6f47;
            font-style: italic;
            letter-spacing: 1px;
            font-family: 'Cormorant Garamond', serif;
        }

        .progress-container {
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border: 3px solid #c9a96e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 40px;
            box-shadow: 0 5px 20px rgba(139, 90, 43, 0.1);
        }

        .progress-label {
            font-family: 'Cormorant Garamond', serif;
            color: #5c3a21;
            margin-bottom: 12px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e8dcc8;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #c9a96e;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #c9a96e, #b8956a, #a07840);
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(201, 169, 110, 0.5);
        }

        .elements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .element-btn {
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border: 3px solid #c9a96e;
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(139, 90, 43, 0.15);
        }

        .element-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(139, 90, 43, 0.25);
            border-color: #a07840;
        }

        .element-btn.visited {
            border-color: #6b8e23;
            box-shadow: 0 5px 20px rgba(107, 142, 35, 0.2);
        }

        .element-btn.visited::after {
            content: '✓';
            position: absolute;
            top: 15px;
            right: 15px;
            color: #6b8e23;
            font-size: 2rem;
            font-weight: bold;
        }

        .element-btn h3 {
            font-family: 'Playfair Display', serif;
            color: #5c3a21;
            font-size: 1.5rem;
            margin-bottom: 12px;
            font-weight: 700;
            font-style: italic;
        }

        .element-btn p {
            color: #6b5a4a;
            font-size: 1.15rem;
            line-height: 1.5;
            font-style: italic;
        }

        .test-btn-container {
            text-align: center;
            margin: 50px 0;
        }

        .test-btn {
            background: linear-gradient(135deg, #c9a96e, #a07840);
            border: none;
            border-radius: 50px;
            padding: 25px 70px;
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(160, 120, 64, 0.3);
            letter-spacing: 2px;
            font-style: italic;
        }

        .test-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(160, 120, 64, 0.4);
        }

        .test-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(58, 42, 26, 0.85);
            z-index: 1000;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border: 4px solid #c9a96e;
            border-radius: 20px;
            max-width: 950px;
            margin: 40px auto;
            padding: 50px;
            position: relative;
            box-shadow: 0 20px 60px rgba(139, 90, 43, 0.3);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            font-family: 'Playfair Display', serif;
            color: #5c3a21;
            font-size: 2.4rem;
            margin-bottom: 25px;
            font-weight: 700;
            border-bottom: 3px solid #c9a96e;
            padding-bottom: 15px;
            font-style: italic;
        }

        .modal-content h3 {
            font-family: 'Cormorant Garamond', serif;
            color: #8b6f47;
            font-size: 1.5rem;
            margin: 25px 0 15px 0;
            font-weight: 700;
        }

        .modal-content p, .modal-content li {
            color: #3a2a1a;
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .modal-content ul {
            margin-left: 25px;
            margin-bottom: 20px;
        }

        .modal-content li {
            color: #4a3a2a;
            margin-bottom: 10px;
        }

        .example-box {
            background: rgba(201, 169, 110, 0.15);
            border-left: 5px solid #c9a96e;
            padding: 18px;
            margin: 18px 0;
            border-radius: 8px;
        }

        .error-box {
            background: rgba(205, 92, 92, 0.1);
            border-left: 5px solid #cd5c5c;
            padding: 18px;
            margin: 18px 0;
            border-radius: 8px;
        }

        .info-box {
            background: rgba(107, 142, 35, 0.1);
            border-left: 5px solid #6b8e23;
            padding: 18px;
            margin: 18px 0;
            border-radius: 8px;
        }

        .quote-box {
            background: linear-gradient(135deg, rgba(201, 169, 110, 0.2), rgba(160, 120, 64, 0.1));
            border-left: 5px solid #c9a96e;
            border-right: 5px solid #c9a96e;
            padding: 25px;
            margin: 25px 0;
            border-radius: 10px;
            text-align: center;
            font-style: italic;
        }

        .quote-text {
            font-size: 1.3rem;
            color: #5c3a21;
            line-height: 1.8;
            margin-bottom: 10px;
            font-family: 'Cormorant Garamond', serif;
        }

        .quote-author {
            font-size: 1.1rem;
            color: #8b6f47;
            font-weight: 600;
        }

        .painting-frame {
            margin: 30px auto;
            max-width: 700px;
            background: linear-gradient(135deg, #d4a574, #b8860b, #8b6914, #d4a574);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 
                0 0 0 4px #8b6914,
                0 0 0 8px #d4a574,
                0 0 0 12px #6b4e0a,
                0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .painting-inner {
            background: #2a1f14;
            padding: 10px;
            border-radius: 4px;
        }

        .painting-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
            max-height: 500px;
            object-fit: contain;
        }

        .painting-fallback {
            width: 100%;
            min-height: 350px;
            background: linear-gradient(135deg, #4a3a2a 0%, #6b5a4a 50%, #4a3a2a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            text-align: center;
            color: #f5edd6;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .painting-fallback::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(212, 165, 116, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(139, 90, 43, 0.2) 0%, transparent 50%);
        }

        .painting-fallback-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #f5edd6;
            position: relative;
            z-index: 1;
            font-style: italic;
        }

        .painting-fallback-author {
            font-size: 1.2rem;
            color: #d4a574;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .painting-fallback-desc {
            font-size: 1.05rem;
            color: #e8dcc8;
            line-height: 1.6;
            max-width: 500px;
            position: relative;
            z-index: 1;
            font-style: italic;
        }

        .painting-caption {
            text-align: center;
            font-style: italic;
            color: #6b5a4a;
            margin-top: 15px;
            font-size: 1.05rem;
            padding: 10px;
        }

        .close-btn {
            background: linear-gradient(135deg, #6b8e23, #556b2f);
            border: none;
            border-radius: 30px;
            padding: 18px 50px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(107, 142, 35, 0.3);
            letter-spacing: 1px;
        }

        .close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(107, 142, 35, 0.4);
        }

        .test-container {
            display: none;
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border: 4px solid #c9a96e;
            border-radius: 20px;
            padding: 50px;
            max-width: 950px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(139, 90, 43, 0.2);
        }

        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #fff9f0, #f0e6d3);
            border: 3px solid #c9a96e;
            border-radius: 15px;
            padding: 18px 30px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: #5c3a21;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(139, 90, 43, 0.2);
            font-weight: 600;
        }

        .question {
            margin-bottom: 35px;
            padding: 25px;
            background: rgba(255, 249, 240, 0.8);
            border-radius: 12px;
            border: 2px solid #c9a96e;
        }

        .question-text {
            font-size: 1.3rem;
            color: #3a2a1a;
            margin-bottom: 18px;
            line-height: 1.8;
            font-weight: 600;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-option {
            background: rgba(255, 249, 240, 0.9);
            border: 2px solid #c9a96e;
            border-radius: 10px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #3a2a1a;
            font-size: 1.2rem;
            font-family: 'EB Garamond', serif;
        }

        .answer-option:hover {
            background: rgba(201, 169, 110, 0.2);
            transform: translateX(8px);
        }

        .answer-option.selected {
            background: rgba(160, 120, 64, 0.2);
            border-color: #a07840;
        }

        .answer-option.correct {
            background: rgba(107, 142, 35, 0.2);
            border-color: #6b8e23;
        }

        .answer-option.incorrect {
            background: rgba(205, 92, 92, 0.2);
            border-color: #cd5c5c;
        }

        .hint-btn {
            background: rgba(201, 169, 110, 0.3);
            border: 2px solid #c9a96e;
            border-radius: 25px;
            padding: 10px 25px;
            color: #5c3a21;
            cursor: pointer;
            font-size: 1.05rem;
            margin-top: 15px;
            transition: all 0.3s ease;
            font-family: 'Cormorant Garamond', serif;
        }

        .hint-btn:hover {
            background: rgba(201, 169, 110, 0.5);
        }

        .hint-text {
            display: none;
            color: #6b5a4a;
            font-style: italic;
            margin-top: 12px;
            padding: 15px;
            background: rgba(201, 169, 110, 0.15);
            border-radius: 8px;
        }

        .submit-test-btn {
            background: linear-gradient(135deg, #6b8e23, #556b2f);
            border: none;
            border-radius: 30px;
            padding: 20px 60px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            margin-top: 40px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(107, 142, 35, 0.3);
            letter-spacing: 1px;
        }

        .submit-test-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(107, 142, 35, 0.4);
        }

        .results {
            display: none;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #fff9f0 0%, #f5edd6 100%);
            border: 4px solid #c9a96e;
            border-radius: 20px;
            max-width: 750px;
            margin: 50px auto;
            box-shadow: 0 20px 60px rgba(139, 90, 43, 0.2);
        }

        .results h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 25px;
            font-weight: 700;
            font-style: italic;
        }

        .results.success h2 { color: #6b8e23; }
        .results.failure h2 { color: #a07840
